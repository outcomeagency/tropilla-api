; Documentos y fotos de campo: subidas medianas (las grandes van por partes).
upload_max_filesize = 64M
post_max_size = 80M
memory_limit = 512M
date.timezone = UTC
expose_php = Off

; Dev: opcache revalida en cada request para ver cambios del bind mount.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
