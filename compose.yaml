# TROPILLA API — entorno de desarrollo.
# Contenedores con prefijo tropilla_ y puertos de host que no chocan con
# traefik/gex/f2 en la misma máquina. Credenciales alineadas con src/.env.example.

name: tropilla-api

x-php: &php
  build:
    context: ./docker/php
  image: tropilla/php:8.4
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  restart: unless-stopped
  working_dir: /var/www/html
  volumes:
    - ./src:/var/www/html
  networks:
    - tropilla

services:
  app:
    <<: *php
    container_name: tropilla_app
    environment:
      CONTAINER_ROLE: app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/tropilla-ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s

  web:
    image: nginx:1.27-alpine
    container_name: tropilla_web
    restart: unless-stopped
    ports:
      - "${API_PORT:-8090}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tropilla

  queue:
    <<: *php
    container_name: tropilla_queue
    environment:
      CONTAINER_ROLE: queue
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--backoff=10", "--max-time=3600"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *php
    container_name: tropilla_scheduler
    environment:
      CONTAINER_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.5
    container_name: tropilla_postgres
    restart: unless-stopped
    # Más locks por transacción: la suite en paralelo (RefreshDatabase × 8 procesos × ~100 tablas) agotaba la tabla de locks (TPA-57).
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    environment:
      POSTGRES_DB: tropilla
      POSTGRES_USER: tropilla
      POSTGRES_PASSWORD: secret
    ports:
      - "${FORWARD_DB_PORT:-5442}:5432"
    volumes:
      - tropilla-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb/20-test-database.sh:/docker-entrypoint-initdb.d/20-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tropilla -d tropilla"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - tropilla

  redis:
    image: redis:7-alpine
    container_name: tropilla_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6389}:6379"
    volumes:
      - tropilla-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - tropilla

  minio:
    image: pgsty/minio:latest  # fork comunitario: MinIO retiró sus imágenes de Docker Hub/quay
    container_name: tropilla_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tropilla
      MINIO_ROOT_PASSWORD: secretsecret
    ports:
      - "${FORWARD_MINIO_PORT:-9010}:9000"           # API S3
      - "${FORWARD_MINIO_CONSOLE_PORT:-9011}:9001"   # consola web
    volumes:
      - tropilla-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - tropilla

  # Crea el bucket (con versionado: los documentos nunca se sobrescriben) y termina.
  minio-init:
    image: pgsty/mc:latest
    container_name: tropilla_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 tropilla secretsecret &&
      mc mb --ignore-existing local/tropilla &&
      mc version enable local/tropilla
      "
    networks:
      - tropilla

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: tropilla_gotenberg
    restart: unless-stopped
    ports:
      - "${FORWARD_GOTENBERG_PORT:-3010}:3000"
    networks:
      - tropilla

networks:
  tropilla:
    driver: bridge

volumes:
  tropilla-pgdata:
  tropilla-redis:
  tropilla-minio:
