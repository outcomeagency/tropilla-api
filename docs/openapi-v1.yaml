        '429': {$ref: '#/components/responses/DemasiadosIntentos'}
  /public/verificaciones/{huella}:
    get:
      tags: [Público]
      summary: Verificación de un registro
      operationId: get_public_verificaciones_huella
      description: TPA-41. 404 si no existe o no es verificable públicamente
      security: []
      parameters:
      - name: huella
        in: path
        required: true
        schema: {type: string}
      - name: locale
        in: query
        required: false
        schema: {type: string}
        description: 'es | en | pt (default: Accept-Language)'
      - {$ref: '#/components/parameters/AcceptLanguage'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Verificacion'}
                required: [data]
                additionalProperties: false
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /public/verificaciones/{huella}/prueba:
    get:
      tags: [Público]
      summary: Descargar prueba.json (+ link al .ots)
      operationId: get_public_verificaciones_huella_prueba
      security: []
      parameters:
      - name: huella
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object}
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /public/anclajes/{anclaje}/recibo:
    get:
      tags: [Público]
      summary: Recibo del anclaje (.ots más reciente) — aditivo TPA-40
      operationId: get_public_anclajes_anclaje_recibo
      description: 'Para verificar con el cliente `ots` (OpenTimestamps) que la raíz del Merkle existía en la fecha del bloque, sin confiar en
        TROPILLA. Es el `anclaje.recibo_url` de `IntegridadRegistro`.'
      security: []
      parameters:
      - name: anclaje
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Uuid'}
      responses:
        '200':
          description: Bytes del recibo
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /public/verificaciones/archivo/{sha256}:
    get:
      tags: [Público]
      summary: ¿Este archivo coincide con una versión registrada?
      operationId: get_public_verificaciones_archivo_sha256
      description: El hash se calcula en el navegador
      security: []
      parameters:
      - name: sha256
        in: path
        required: true
        schema: {type: string}
      - name: locale
        in: query
        required: false
        schema: {type: string}
        description: 'es | en | pt (default: Accept-Language)'
      - {$ref: '#/components/parameters/AcceptLanguage'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/VerificacionArchivo'}
                required: [data]
                additionalProperties: false
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /public/verificaciones/archivo:
    post:
      tags: [Público]
      summary: Igual, subiendo el archivo (no se guarda)
      operationId: post_public_verificaciones_archivo
      description: multipart, ≤ 25 MB
      security: []
      parameters:
      - name: locale
        in: query
        required: false
        schema: {type: string}
        description: 'es | en | pt (default: Accept-Language)'
      - {$ref: '#/components/parameters/AcceptLanguage'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/VerificacionArchivo'}
                required: [data]
                additionalProperties: false
        '422': {$ref: '#/components/responses/Validacion'}
  /public/enlaces/{token}:
    get:
      tags: [Público]
      summary: Documento compartido por enlace
      operationId: get_public_enlaces_token
      description: 410 si venció o fue revocado
      security: []
      parameters:
      - name: token
        in: path
        required: true
        schema: {type: string}
      - name: locale
        in: query
        required: false
        schema: {type: string}
        description: 'es | en | pt (default: Accept-Language)'
      - {$ref: '#/components/parameters/AcceptLanguage'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/EnlacePublico'}
                required: [data]
                additionalProperties: false
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /public/sitemap:
    get:
      tags: [Público]
      summary: Entradas para sitemap.xml
      operationId: get_public_sitemap
      description: Solo perfiles en directorio y ofertas/contratos publicados
      security: []
      parameters:
      - {$ref: '#/components/parameters/AcceptLanguage'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/SitemapEntrada'}
                required: [data]
                additionalProperties: false
  /health:
    get:
      tags: [Público]
      summary: Salud
      operationId: get_health
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object}
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      description: 'Token Sanctum (personal access token). App: uno por dispositivo. Web: lo guarda Next en cookie httpOnly y lo reenvía server-side.'
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: {type: string, enum: [es, en, pt]}
  responses:
    NoAutenticado:
      description: 'No autenticado (code: no_autenticado)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Prohibido:
      description: 'Sin permiso (code: sin_permiso | membresia_revocada)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NoEncontrado:
      description: 'No existe o no es visible para el usuario (code: no_encontrado)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Validacion:
      description: 'Validación (code: validacion | requiere_confirmacion | regla_bloqueante | no_publicable | preview_requerida)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflicto:
      description: 'Conflicto (code: conflicto_row_version | version_no_vigente | tokens_insuficientes | identificacion_duplicada | version_api | comprometido)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DemasiadosIntentos:
      description: 'Rate limit (code: demasiados_intentos); header Retry-After'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Uuid: {type: string, format: uuid, description: 'UUID (v7 si lo genera el cliente), minúsculas'}
    Decimal:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]*[1-9])?$
      description: Decimal canónico como string (kg, %, dinero)
      examples: ['412.5']
    Fecha: {type: string, format: date, examples: ['2026-10-15']}
    FechaHora:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
      description: ISO-8601 UTC con milisegundos
      examples: ['2026-10-15T12:30:00.000Z']
    Hash: {type: string, pattern: '^[0-9a-f]{64}$'}
    Error:
      type: object
      properties:
        message: {type: string, description: 'Mensaje legible, en el idioma de Accept-Language'}
        code: {type: string, description: Código estable snake_case (ver api-v1.md §3)}
        errors:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
          description: Errores por campo (validación)
        advertencias:
          type: array
          items:
            type: object
            properties:
              codigo: {type: string}
              mensaje: {type: string}
              detalle: {type: object, additionalProperties: true}
            additionalProperties: false
        request_id: {type: string}
      required: [message, code]
      additionalProperties: false
    MetaCursor:
      type: object
      properties:
        next_cursor: {type: [string, 'null']}
        prev_cursor: {type: [string, 'null']}
        limit: {type: integer}
      required: [next_cursor, limit]
      additionalProperties: false
    Usuario:
      type: object
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        nombre: {type: string}
        email: {type: [string, 'null']}
        telefono: {type: [string, 'null']}
        idioma: {type: string, enum: [es, en, pt]}
        pais: {type: [string, 'null']}
        email_verificado: {type: boolean}
        foto_url: {type: [string, 'null']}
        es_comprador: {type: boolean}
        es_profesional: {type: boolean}
        es_staff: {type: boolean}
        created_at: {$ref: '#/components/schemas/FechaHora'}
      required: [id, nombre, idioma]
      additionalProperties: false
    MembresiaResumen:
      type: object
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        establecimiento_id: {$ref: '#/components/schemas/Uuid'}
        establecimiento_nombre: {type: string}
        productor_nombre: {type: string}
        rol: {type: string, enum: [dueno, admin, encargado, asesor, lectura]}
        abilities:
          type: array
          items: {type: string}
      required: [id, establecimiento_id, rol, abilities]
      additionalProperties: false
    Me:
      type: object
      properties:
        usuario: {$ref: '#/components/schemas/Usuario'}
        membresias:
          type: array
          items: {$ref: '#/components/schemas/MembresiaResumen'}
        comprador:
          oneOf:
          - {$ref: '#/components/schemas/Comprador'}
          - {type: 'null'}
        profesional:
          oneOf:
          - {$ref: '#/components/schemas/Profesional'}
          - {type: 'null'}
        organizaciones:
          type: array
          items:
            type: object
            properties:
              id: {$ref: '#/components/schemas/Uuid'}
              nombre: {type: string}
              rol: {type: string, enum: [admin, operador]}
            additionalProperties: false
      required: [usuario, membresias]
      additionalProperties: false
    DispositivoInput:
      type: object
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        plataforma: {type: string, enum: [android, ios, web]}
        nombre: {type: string}
        app_version: {type: string}
        fcm_token: {type: [string, 'null']}
      required: [id, plataforma]
      additionalProperties: false
    RegisterInput:
      type: object
      properties:
        nombre: {type: string, maxLength: 120}
        email: {type: [string, 'null']}
        telefono: {type: [string, 'null']}
        password: {type: string, maxLength: 200}
        idioma: {type: string, enum: [es, en, pt]}
        cliente: {type: string, enum: [web, app]}
        dispositivo: {$ref: '#/components/schemas/DispositivoInput'}
      required: [nombre, password, cliente]
      additionalProperties: false
    LoginInput:
      type: object
      properties:
        email: {type: [string, 'null']}
        telefono: {type: [string, 'null']}
        password: {type: string}
        cliente: {type: string, enum: [web, app]}
        dispositivo: {$ref: '#/components/schemas/DispositivoInput'}
      required: [password, cliente]
      additionalProperties: false
    TokenRespuesta:
      type: object
      properties:
        token: {type: string, description: Token Sanctum. La web lo guarda en cookie httpOnly del lado de Next}
        usuario: {$ref: '#/components/schemas/Usuario'}
        membresias:
          type: array
          items: {$ref: '#/components/schemas/MembresiaResumen'}
      required: [token, usuario]
      additionalProperties: false
    Comprador:
      type: object
      properties:
        empresa: {type: string}
        tipo: {type: string, enum: [frigorifico, exportador, gastronomico, institucion, productor, otro]}
        pais: {type: string}
        idiomas:
          type: array
          items: {type: string, enum: [es, en, pt]}
        volumen_habitual: {type: [string, 'null']}
      required: [empresa, tipo, pais]
      additionalProperties: false
    Profesional:
      type: object
      properties:
        slug: {type: string}
        nombre_publico: {type: string}
        profesion: {type: string, enum: [veterinario, ing_agronomo, asesor, otro]}
        matricula_declarada: {type: [string, 'null']}
        especialidades:
          type: array
          items: {type: string}
        zonas: {type: object, additionalProperties: true}
        idiomas:
          type: array
          items: {type: string, enum: [es, en, pt]}
        bio: {type: [string, 'null']}
        publico: {type: boolean}
      required: [slug, nombre_publico, profesion]
      additionalProperties: false
    Notificacion:
      type: object
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        tipo: {type: string}
        establecimiento_id:
          oneOf:
          - {$ref: '#/components/schemas/Uuid'}
          - {type: 'null'}
        titulo: {type: string}
        cuerpo: {type: string}
        datos: {type: object, additionalProperties: true}
        leida_en:
          oneOf:
          - {$ref: '#/components/schemas/FechaHora'}
          - {type: 'null'}
        created_at: {$ref: '#/components/schemas/FechaHora'}
      additionalProperties: false
    Productor:
      type: object
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        tipo: {type: string, enum: [persona_humana, sociedad]}
        nombre: {type: string}
        cuit: {type: [string, 'null'], description: 'Solo dueño/admin; si no, null'}
        contacto: {type: object, additionalProperties: true}
        asociaciones:
          type: array
          items: {type: object, additionalProperties: true}
        logo_url: {type: [string, 'null']}
        row_version: {type: integer}
      additionalProperties: false
    ProductorInput:
      type: object
      properties:
        tipo: {type: string, enum: [persona_humana, sociedad]}
        nombre: {type: string, maxLength: 200}
        cuit: {type: [string, 'null']}
        contacto: {type: object, additionalProperties: true}
        asociaciones:
          type: array
          items: {type: object, additionalProperties: true}
        logo_sha256:
          oneOf:
          - {$ref: '#/components/schemas/Hash'}
          - {type: 'null'}
        row_version: {type: integer}
      additionalProperties: false
    ZonasSanitarias:
      type: object
      properties:
        aftosa_zona: {type: [string, 'null']}
        garrapata: {type: [string, 'null'], enum: [erradicacion, control, libre]}
        rabia_endemica: {type: boolean}
        fasciola_endemica: {type: boolean}
      additionalProperties: false
    Establecimiento:
      type: object
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        productor_id: {$ref: '#/components/schemas/Uuid'}
        nombre: {type: string}
        provincia_codigo: {type: string}
        departamento_codigo: {type: string}
        localidad: {type: [string, 'null']}
        renspa: {type: [string, 'null'], description: 'Privado: solo dueño/admin'}
        ubicacion:
          type: [object, 'null']
          properties:
            lat: {$ref: '#/components/schemas/Decimal'}
            lon: {$ref: '#/components/schemas/Decimal'}
          description: 'Privada: solo dueño/admin'
          additionalProperties: false
        superficie_ha:
          oneOf:
          - {$ref: '#/components/schemas/Decimal'}
          - {type: 'null'}
        actividades:
          type: array
          items: {type: string}
        especies:
          type: array
          items: {type: string, enum: [BOV, BUB]}
        zonas_sanitarias: {$ref: '#/components/schemas/ZonasSanitarias'}
        interdiccion_vigente: {type: [object, 'null'], additionalProperties: true}
        instalaciones:
          type: array
          items: {type: string}
        historia: {type: [string, 'null']}
        mi_rol: {type: string, enum: [dueno, admin, encargado, asesor, lectura]}
        abilities:
          type: array
          items: {type: string}
        row_version: {type: integer}
        created_at: {$ref: '#/components/schemas/FechaHora'}
      required: [id, nombre, especies, mi_rol]
      additionalProperties: false
    EstablecimientoInput:
      type: object
      properties:
        productor_id: {$ref: '#/components/schemas/Uuid'}
        nombre: {type: string, maxLength: 120}
        provincia_codigo: {type: string}
        departamento_codigo: {type: string}
        localidad: {type: [string, 'null']}
        renspa: {type: [string, 'null']}
        ubicacion:
          type: [object, 'null']
          properties:
            lat: {$ref: '#/components/schemas/Decimal'}
            lon: {$ref: '#/components/schemas/Decimal'}
          additionalProperties: false
        superficie_ha:
          oneOf:
          - {$ref: '#/components/schemas/Decimal'}
          - {type: 'null'}
        actividades:
          type: array
          items: {type: string}
        especies:
          type: array
          items: {type: string, enum: [BOV, BUB]}
        zonas_sanitarias: {$ref: '#/components/schemas/ZonasSanitarias'}
        instalaciones:
          type: array
          items: {type: string}
        historia: {type: [string, 'null']}
        row_version: {type: string, description: Obligatorio en PATCH}
      additionalProperties: false
    OnboardingInput:
      type: object
      properties:
        productor: {$ref: '#/components/schemas/ProductorInput'}
        establecimiento: {$ref: '#/components/schemas/EstablecimientoInput'}
      required: [productor, establecimiento]
      additionalProperties: false
    Membresia:
      type: object
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        usuario:
          type: object
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            nombre: {type: string}
            email: {type: [string, 'null']}
            telefono: {type: [string, 'null']}
          additionalProperties: false
        rol: {type: string, enum: [dueno, admin, encargado, asesor, lectura]}
        estado: {type: string, enum: [activa, revocada]}
        aceptada_en: {$ref: '#/components/schemas/FechaHora'}
        revocada_en:
          oneOf:
          - {$ref: '#/components/schemas/FechaHora'}
          - {type: 'null'}
      additionalProperties: false
    InvitacionInput:
      type: object
      properties:
        email: {type: [string, 'null']}
        telefono: {type: [string, 'null']}
        rol: {type: string, enum: [admin, encargado, asesor, lectura]}
      required: [rol]
      additionalProperties: false
    Invitacion:
      type: object
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        email: {type: [string, 'null']}
        telefono: {type: [string, 'null']}
        rol: {type: string, enum: [dueno, admin, encargado, asesor, lectura]}
        expira_en: {$ref: '#/components/schemas/FechaHora'}
        aceptada_en:
          oneOf:
          - {$ref: '#/components/schemas/FechaHora'}
          - {type: 'null'}
        revocada_en:
          oneOf:
          - {$ref: '#/components/schemas/FechaHora'}
          - {type: 'null'}
        url: {type: [string, 'null'], description: Solo en la respuesta de creación}
      additionalProperties: false
    InvitacionPublica:
      type: object
      properties:
        establecimiento_nombre: {type: string}
        productor_nombre: {type: string}
        rol: {type: string, enum: [dueno, admin, encargado, asesor, lectura]}
        invitado_por: {type: string}
        expira_en: {$ref: '#/components/schemas/FechaHora'}
        vigente: {type: boolean}
      additionalProperties: false
    Auditoria:
      type: object
      properties:
        id: {type: integer}
        usuario:
          type: [object, 'null']
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            nombre: {type: string}
          additionalProperties: false
        entidad: {type: string}
        entidad_id: {type: string}
        accion: {type: string}
        antes: {type: [object, 'null'], additionalProperties: true}
        despues: {type: [object, 'null'], additionalProperties: true}
        motivo: {type: [string, 'null']}
        created_at: {$ref: '#/components/schemas/FechaHora'}
      additionalProperties: false
    Inicio:
      type: object
      properties:
        existencias:
          type: array
          items: {$ref: '#/components/schemas/Existencia'}
        pendientes:
          type: object
          properties:
            tareas_sanitarias: {type: integer}
            partos_proximos: {type: integer}
            partos_vencidos: {type: integer}
            recategorizaciones: {type: integer}
            documentos_por_vencer: {type: integer}
            consultas_nuevas: {type: integer}
            tomas_por_confirmar: {type: integer}
            revisiones_abiertas: {type: integer}
            items:
              type: array
              items:
                type: object
                properties:
                  tipo: {type: string}
                  titulo: {type: string}
                  fecha:
                    oneOf:
                    - {$ref: '#/components/schemas/Fecha'}
                    - {type: 'null'}
                  ruta: {type: string}
                  entidad_id:
                    oneOf:
                    - {$ref: '#/components/schemas/Uuid'}
                    - {type: 'null'}
                additionalProperties: false
          additionalProperties: false
        actividad:
          type: array
          items: {$ref: '#/components/schemas/EventoResumen'}
      additionalProperties: false
      description: '`pendientes.items[].tipo`: tarea | tarea_vencida | parto_proximo | parto_vencido | recategorizacion | documento_por_vencer |
        documento_vencido | consulta | toma | revision; semana = próximos 7 días (documentos: 30). `actividad` = últimos 10 eventos por fecha
        de carga. `variacion_mes` = nacimientos/partos/ingresos − muertes/egresos/faenas/pérdidas del mes ± movimientos de categoría de lotes
        anónimos; las altas de inventario no cuentan (TPA-52).'
    Existencia:
      type: object
      properties:
        especie: {type: string, enum: [BOV, BUB]}
        categoria: {type: string}
        categoria_nombre: {type: string}
        cabezas: {type: integer}
        individuales: {type: integer}
        anonimas: {type: integer}
        variacion_mes: {type: integer}
      additionalProperties: false
    Catalogos:
      type: object
      description: 'Las filas por especie (razas, categorias, categorias_faena, reglas_categoria, parametros, plantillas_sanitarias)
        traen `especie_codigo` (BOV | BUB | null); `especie` se mantiene como alias con el mismo valor por compatibilidad.'
      properties:
        version: {type: integer}
        especies:
          type: array
          items: {type: object, additionalProperties: true}
        razas:
          type: array
          items: {type: object, additionalProperties: true}
        categorias:
          type: array
          items: {type: object, additionalProperties: true}
        categorias_faena:
          type: array
          items: {type: object, additionalProperties: true}
        reglas_categoria:
          type: array
          items: {type: object, additionalProperties: true}
        parametros:
          type: array
          items: {type: object, additionalProperties: true}
        tipos_evento:
          type: array
          items:
            type: object
            properties:
              codigo: {type: string}
              nombres:
                type: object
                properties:
                  es: {type: string}
                  en: {type: string}
                  pt: {type: string}
              modulo: {type: string}
              fase: {type: string}
              sujetos_admitidos:
