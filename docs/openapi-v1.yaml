      summary: Completar multipart
      operationId: post_archivos_subidas_subida_completar
      description: 'Cierra el multipart (o ensambla la subida simple) y **verifica SHA-256 y bytes** del objeto: si no coinciden el objeto se
        borra (la clave es el hash) → 422 `archivo_corrupto`. Subida vencida o cerrada → 422 `subida_vencida`. Idempotente si el archivo
