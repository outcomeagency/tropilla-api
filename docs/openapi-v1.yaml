# TROPILLA — OpenAPI 3.1 del MVP (TPA-7). Tablas legibles en technical/api-v1.md §6 (mantener ambos en sincronía; este YAML manda).
openapi: 3.1.0
info:
  title: TROPILLA API
  version: 1.0.0
  description: Contrato /api/v1 del MVP. Convenciones en brain/technical/api-v1.md; tablas en modelo-datos.md; sync e integridad en sync-e-integridad.md.
    JSON snake_case; decimales como string; fechas ISO-8601 UTC con milisegundos.
servers:
- {url: 'https://api.tropilla.app/api/v1', description: 'Producción (dominio a definir, M2)'}
- {url: 'http://localhost:8080/api/v1', description: Docker local}
security:
- {sanctum: []}
tags:
- {name: Auth}
- {name: Cuenta}
- {name: Establecimientos}
- {name: Usuarios}
- {name: Catálogos}
- {name: Hacienda}
- {name: Eventos}
- {name: Reproducción}
- {name: Sanidad}
- {name: Documentos}
- {name: Archivos}
- {name: Sync}
- {name: Comercial}
- {name: Ofertas}
- {name: Contratos}
- {name: Comprador}
- {name: Perfil}
- {name: Organizaciones}
- {name: Público}
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registro con email o teléfono
      operationId: post_auth_register
      description: Envía verificación de email. TPA-9
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterInput'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/TokenRespuesta'}
                required: [data]
                additionalProperties: false
        '422': {$ref: '#/components/responses/Validacion'}
        '429': {$ref: '#/components/responses/DemasiadosIntentos'}
  /auth/login:
    post:
      tags: [Auth]
      summary: Login (web o app); emite token Sanctum por dispositivo
      operationId: post_auth_login
      description: Rate limit 5/min/IP. La web guarda el token en cookie httpOnly (server-side)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/TokenRespuesta'}
                required: [data]
                additionalProperties: false
        '422': {$ref: '#/components/responses/Validacion'}
        '429': {$ref: '#/components/responses/DemasiadosIntentos'}
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoca el token actual
      operationId: post_auth_logout
      responses:
        '204': {description: Sin contenido}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '422': {$ref: '#/components/responses/Validacion'}
  /auth/me:
    get:
      tags: [Auth]
      summary: Usuario, membresías con abilities, perfiles
      operationId: get_auth_me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Me'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
    patch:
      tags: [Auth]
      summary: Editar nombre, idioma, foto, país
      operationId: patch_auth_me
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Usuario'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Usuario'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '422': {$ref: '#/components/responses/Validacion'}
        '409': {$ref: '#/components/responses/Conflicto'}
  /auth/email/reenviar:
    post:
      tags: [Auth]
      summary: Reenviar verificación de email
      operationId: post_auth_email_reenviar
      responses:
        '204': {description: Sin contenido}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '422': {$ref: '#/components/responses/Validacion'}
  /auth/email/verificar:
    post:
      tags: [Auth]
      summary: Verificar email con token
      operationId: post_auth_email_verificar
      description: Body {token}
      security: []
      responses:
        '204': {description: Sin contenido}
        '422': {$ref: '#/components/responses/Validacion'}
  /auth/password/olvide:
    post:
      tags: [Auth]
      summary: Pedir restablecimiento
      operationId: post_auth_password_olvide
      description: Body {email|telefono}. Siempre 204 (no filtra existencia)
      security: []
      responses:
        '204': {description: Sin contenido}
        '422': {$ref: '#/components/responses/Validacion'}
  /auth/password/restablecer:
    post:
      tags: [Auth]
      summary: Restablecer contraseña
      operationId: post_auth_password_restablecer
      description: Body {token, password}; revoca todos los tokens
      security: []
      responses:
        '204': {description: Sin contenido}
        '422': {$ref: '#/components/responses/Validacion'}
  /auth/dispositivos/{dispositivo}:
    put:
      tags: [Auth]
      summary: Actualizar FCM token / versión de app
      operationId: put_auth_dispositivos_dispositivo
      parameters:
      - name: dispositivo
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DispositivoInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/DispositivoInput'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '422': {$ref: '#/components/responses/Validacion'}
  /auth/dispositivos/{dispositivo}/revocar:
    post:
      tags: [Auth]
      summary: Revocar un dispositivo (y su token)
      operationId: post_auth_dispositivos_dispositivo_revocar
      parameters:
      - name: dispositivo
        in: path
        required: true
        schema: {type: string}
      responses:
        '204': {description: Sin contenido}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '422': {$ref: '#/components/responses/Validacion'}
  /me/comprador:
    get:
      tags: [Cuenta]
      summary: Perfil de comprador
      operationId: get_me_comprador
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Comprador'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
    put:
      tags: [Cuenta]
      summary: Crear/editar perfil de comprador (cuenta liviana)
      operationId: put_me_comprador
      description: TPA-57
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Comprador'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Comprador'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '422': {$ref: '#/components/responses/Validacion'}
  /me/profesional:
    get:
      tags: [Cuenta]
      summary: Perfil de profesional
      operationId: get_me_profesional
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Profesional'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
    put:
      tags: [Cuenta]
      summary: Crear/editar perfil de profesional
      operationId: put_me_profesional
      description: TPA-58
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Profesional'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Profesional'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '422': {$ref: '#/components/responses/Validacion'}
  /me/notificaciones:
    get:
      tags: [Cuenta]
      summary: Notificaciones in-app
      operationId: get_me_notificaciones
      parameters:
      - name: cursor
        in: query
        required: false
        schema: {type: string}
        description: Cursor opaco devuelto en meta.next_cursor
      - name: limit
        in: query
        required: false
        schema: {type: integer}
        description: Default 25, máx. 100
      - name: no_leidas
        in: query
        required: false
        schema: {type: string}
      responses:
        '200':
          description: OK (paginado por cursor)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Notificacion'}
                  meta: {$ref: '#/components/schemas/MetaCursor'}
                required: [data, meta]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
  /me/notificaciones/{notificacion}/leer:
    post:
      tags: [Cuenta]
      summary: Marcar leída
      operationId: post_me_notificaciones_notificacion_leer
      parameters:
      - name: notificacion
        in: path
        required: true
        schema: {type: string}
      responses:
        '204': {description: Sin contenido}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '422': {$ref: '#/components/responses/Validacion'}
  /me/preferencias-notificacion:
    get:
      tags: [Cuenta]
      summary: Preferencias guardadas (aditivo TPA-53)
      operationId: get_me_preferencias_notificacion
      description: 'Lista [{establecimiento_id, tipo, push, email, resumen_diario}] + `meta.defaults` (push sí, email y resumen no).'
      responses:
        '200': {description: OK}
        '401': {$ref: '#/components/responses/NoAutenticado'}
    put:
      tags: [Cuenta]
      summary: Preferencias push/email/resumen diario
      operationId: put_me_preferencias_notificacion
      description: Body [{establecimiento_id?, tipo, push, email, resumen_diario}]
      responses:
        '204': {description: Sin contenido}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '422': {$ref: '#/components/responses/Validacion'}
  /onboarding:
    post:
      tags: [Establecimientos]
      summary: Alta de productor + primer establecimiento (el usuario queda dueño)
      operationId: post_onboarding
      description: TPA-10
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OnboardingInput'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Establecimiento'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '422': {$ref: '#/components/responses/Validacion'}
  /productores/{productor}:
    get:
      tags: [Establecimientos]
      summary: Ver productor
      operationId: get_productores_productor
      description: CUIT solo para dueño/admin
      parameters:
      - name: productor
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Productor'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
    patch:
      tags: [Establecimientos]
      summary: Editar productor
      operationId: patch_productores_productor
      description: '**Ability:** `establecimiento.editar` (modelo-datos.md §13). row_version obligatorio'
      parameters:
      - name: productor
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductorInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Productor'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '422': {$ref: '#/components/responses/Validacion'}
        '409': {$ref: '#/components/responses/Conflicto'}
  /establecimientos:
    get:
      tags: [Establecimientos]
      summary: Mis establecimientos con rol
      operationId: get_establecimientos
      description: Selector (TPA-12)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Establecimiento'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
    post:
      tags: [Establecimientos]
      summary: Nuevo establecimiento de un productor existente
      operationId: post_establecimientos
      description: Requiere ser dueño/admin de otro establecimiento del productor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EstablecimientoInput'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Establecimiento'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '422': {$ref: '#/components/responses/Validacion'}
  /establecimientos/{establecimiento}:
    get:
      tags: [Establecimientos]
      summary: Ver establecimiento
      operationId: get_establecimientos_establecimiento
      description: '**Ability:** `establecimiento.ver` (modelo-datos.md §13). RENSPA/ubicación solo con establecimiento.ver_privados'
      parameters:
      - name: establecimiento
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Establecimiento'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
    patch:
      tags: [Establecimientos]
      summary: Editar datos, zonas, instalaciones
      operationId: patch_establecimientos_establecimiento
      description: '**Ability:** `establecimiento.editar` (modelo-datos.md §13). TPA-13. 409 conflicto_row_version'
      parameters:
      - name: establecimiento
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EstablecimientoInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Establecimiento'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '422': {$ref: '#/components/responses/Validacion'}
        '409': {$ref: '#/components/responses/Conflicto'}
  /establecimientos/{establecimiento}/inicio:
    get:
      tags: [Establecimientos]
      summary: 'Inicio: existencias, pendientes, actividad'
      operationId: get_establecimientos_establecimiento_inicio
      description: '**Ability:** `establecimiento.ver` (modelo-datos.md §13). TPA-52'
      parameters:
      - name: establecimiento
        in: path
        required: true
        schema: {type: string}
      - name: especie
        in: query
        required: false
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Inicio'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /establecimientos/{establecimiento}/existencias:
    get:
      tags: [Establecimientos]
      summary: Existencias por especie y categoría
      operationId: get_establecimientos_establecimiento_existencias
      description: '**Ability:** `establecimiento.ver` (modelo-datos.md §13).'
      parameters:
      - name: establecimiento
        in: path
        required: true
        schema: {type: string}
      - name: especie
        in: query
        required: false
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Existencia'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /establecimientos/{establecimiento}/membresias:
    get:
      tags: [Usuarios]
      summary: Usuarios y roles
      operationId: get_establecimientos_establecimiento_membresias
      description: '**Ability:** `usuarios.ver` (modelo-datos.md §13).'
      parameters:
      - name: establecimiento
        in: path
        required: true
        schema: {type: string}
      - name: estado
        in: query
        required: false
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Membresia'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
  /establecimientos/{establecimiento}/membresias/{membresia}/rol:
    post:
      tags: [Usuarios]
      summary: Cambiar rol (revoca y crea)
      operationId: post_establecimientos_establecimiento_membresias_membresia_rol
      description: '**Ability:** `usuarios.gestionar` (modelo-datos.md §13).'
      parameters:
      - name: establecimiento
        in: path
        required: true
        schema: {type: string}
      - name: membresia
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RolInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Membresia'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '422': {$ref: '#/components/responses/Validacion'}
  /establecimientos/{establecimiento}/membresias/{membresia}/revocar:
    post:
      tags: [Usuarios]
      summary: Revocar acceso
      operationId: post_establecimientos_establecimiento_membresias_membresia_revocar
      description: '**Ability:** `usuarios.gestionar` (modelo-datos.md §13). TPA-11'
      parameters:
      - name: establecimiento
        in: path
        required: true
        schema: {type: string}
      - name: membresia
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MotivoInput'}
      responses:
        '204': {description: Sin contenido}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '422': {$ref: '#/components/responses/Validacion'}
  /establecimientos/{establecimiento}/titularidad:
    post:
      tags: [Usuarios]
      summary: Transferir titularidad
      operationId: post_establecimientos_establecimiento_titularidad
      description: '**Ability:** `titularidad.transferir` (modelo-datos.md §13). Solo el dueño'
      parameters:
      - name: establecimiento
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TitularidadInput'}
      responses:
        '204': {description: Sin contenido}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '422': {$ref: '#/components/responses/Validacion'}
  /establecimientos/{establecimiento}/invitaciones:
    get:
      tags: [Usuarios]
      summary: Invitaciones
      operationId: get_establecimientos_establecimiento_invitaciones
      description: '**Ability:** `usuarios.gestionar` (modelo-datos.md §13).'
      parameters:
      - name: establecimiento
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Invitacion'}
                required: [data]
                additionalProperties: false
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
    post:
      tags: [Usuarios]
      summary: Invitar por email o teléfono con rol
      operationId: post_establecimientos_establecimiento_invitaciones
      description: '**Ability:** `usuarios.gestionar` (modelo-datos.md §13). TPA-11'
      parameters:
      - name: establecimiento
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvitacionInput'}
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Invitacion'}
                required: [data]
                additionalProperties: false
