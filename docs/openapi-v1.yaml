      operationId: post_archivos_subidas
      description: '200 {estado: completo} si ya existe (dedupe por SHA-256: no se sube de nuevo). TPA-44. `simple` (un PUT a `url`) si
        `bytes` < 8 MiB; si no `multipart` con `partes[]` de `parte_bytes` (5 MiB). URLs prefirmadas contra el almacén (S3/MinIO, host
